name: Radar

# Roda o workflow de verdade no n8n (CLI, sem interface), com a API do ats-match ao lado,
# confere o resultado e publica a página. Agendado para todo dia útil às 8h de Brasília.
on:
  schedule:
    - cron: "0 11 * * 1-5"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar-${{ github.ref }}
  cancel-in-progress: true

env:
  N8N_VERSION: 2.41.4

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Subir a API do ats-match
        run: |
          pip install "ats-match @ git+https://github.com/arthurpenedo/ats-match"
          nohup uvicorn ats_match.api:app --host 127.0.0.1 --port 8000 > ats.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: n8n-${{ env.N8N_VERSION }}
      - name: Instalar o n8n
        run: npm install -g --no-audit --no-fund n8n@${{ env.N8N_VERSION }}
      - name: Subir a Meta falsa e ligar o WhatsApp apontando para ela
        run: |
          nohup node scripts/meta-falsa.js 9999 token-de-teste > meta.log 2>&1 &
          node scripts/config-teste.js http://localhost:9999/v23.0
      - name: Importar e executar o workflow
        env:
          N8N_USER_FOLDER: ${{ runner.temp }}/n8n
          N8N_DIAGNOSTICS_ENABLED: "false"
        run: |
          n8n import:workflow --input=workflows/radar-vagas.json
          n8n import:credentials --input=credenciais/whatsapp-teste.json
          n8n execute --id=radarVagasN8n001 --rawOutput > execucao.json
          node scripts/extrair.js execucao.json resumo.json
      - name: Conferir o envio pelo WhatsApp (modelo aprovado)
        run: |
          curl -s http://localhost:9999/enviadas > whatsapp.json && cat whatsapp.json
          node -e "const e=require('./whatsapp.json'); const r=require('./resumo.json');
            const ok = r.whatsapp_enviado && e.length === 1 && e[0].modelo === 'radar_vagas'
              && e[0].parametros.length === 6 && e[0].parametros[1] === String(r.vagas.length);
            if (!ok) { console.error('envio pelo WhatsApp não confere'); process.exit(1); }
            console.log('✓ modelo radar_vagas enviado:', e[0].parametros.join(' | '));"
      - name: Montar a página
        run: node scripts/pagina.js resumo.json site/index.html && cp resumo.json site/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar
          path: |
            site
            execucao.json
            ats.log
            meta.log
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: executar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
